
# ======== МОНИТОРЫ ========
monitor=HDMI-A-1, 2560x1440@60, 0x0, 1
monitor=eDP-1, 1920x1080@60, 2560x345, 1
# ======== АВТОЗАПУСК ========
exec-once = qs
exec-once = lxqt-policykit-agent
exec-once = swaync
exec-once = wl-paste --watch cliphist store
exec-once = swww-daemon && swww img ~/Pictures/wall.png --transition-type any
exec-once = hypridle
# ======== ОФОРМЛЕНИЕ ========
source = ~/.config/hypr/hyprcolors.conf



source = ~/.config/hypr/animations.conf


input {
    kb_layout = us,ru
    # kb_options = grp:win_space_toggle
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ======== ОКНА ========    

windowrule {
    name = float pavucontrol
    match:class = pavucontrol
    float = on
}

windowrule {
    name = float file progress
    match:title = FIle Operation Progress
    float = on
}


# Ignore maximize requests from apps. You'll probably like this.


# Fix some dragging issues with XWayland


# # Opacity rules
windowrule {
    name = opacity global
    match:class = ^(.*)$
    opacity = 0.8 0.6
}


windowrule {
    name = thunar transparency
    match:class = ^(thunar)$
    opacity = 0.75 0.5
}


windowrule {
    name = thunar aesthetics
    match:class = ^(thunar|Thunar)$
    
    opacity = 0.8 0.6
}

# ======== ГЕСТУРЫ ========
gesture = 3, horizontal, workspace

# ======== БИНДИНГИ ========
# ------ Основные ------
bind = SUPER, RETURN, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, E, exec, thunar
bind = SUPER, F, fullscreen, 1
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, SPACE, exec, hyprctl switchxkblayout next
bind = SUPER, S, exec, codium ~/.config/hypr
bind = SUPER, B, exec, firefox
bind = SUPER, W, exec, overskride
bind = SUPER, C, exec, codium
bind = SUPER, A, exec, ~/android-studio/bin/studio.sh
bind = SUPER, Y, exec, yandex-music
bind = SUPER, T, exec, telegram-desktop
bind = SUPER, O, exec, obsidian

# ------ Навигация ------
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# ------ Перемещение окон ------
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d
bindm = SUPER, mouse:272, movewindow 
bindm = SUPER, mouse:273, resizewindow 


# ------ Рабочие столы ------
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8

bind = ALT, Tab, workspace, previous
bind = SUPER SHIFT, left/right, movetoworkspace, -1/+1
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8

# ------ Мультимедиа ------
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +20%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 20%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ------ Скриншоты ------
# Screenshot a window
bind = SUPER, PRINT, exec, hyprshot -m window

# Screenshot a region
bind = SHIFT, PRINT, exec, hyprshot -m region


# ------ Дополнительно ------
bind = SUPER SHIFT, R, exec, hyprctl reload
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo

# QuickShell Layer Rules
source = /home/blake/.config/quickshell/hyprland-layer-config.conf
